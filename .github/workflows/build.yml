name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v3
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Download SDL2 Source
        run: |
          curl -L https://github.com/libsdl-org/SDL/releases/download/release-2.30.2/SDL2-2.30.2.tar.gz -o sdl2.tar.gz
          tar -xzf sdl2.tar.gz
          mv SDL2-2.30.2 sdl2

      - name: Compile Game to Android Shared Library (.so)
        run: |
          # Компилируем C++ и ARM64 Neon код под Android с помощью NDK Clang
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ \
            -O3 -std=c++17 -shared -fPIC \
            main.cpp \
            -I./sdl2/include \
            -L./sdl2/build/.libs \
            -lSDL2 -llog -landroid -lGLESv2 -lEGL \
            -o libmain.so

      - name: Upload APK/Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnowGlobe-ARM64-Lib
          path: libmain.so
